# {{title}} for Qt through qt6ct, with the Fusion style
# Built with: {{command}}
#
# The colours of the palette roles, as #aarrggbb in Qt's order: WindowText,
# Button, Light, Midlight, Dark, Mid, Text, BrightText, ButtonText, Base,
# Window, Shadow, Highlight, HighlightedText, Link, LinkVisited,
# AlternateBase, NoRole, ToolTipBase, ToolTipText, PlaceholderText, Accent.
# Select it as the colour scheme in qt6ct.conf.

[ColorScheme]
active_colors=#ff{{text|bare}}, #ff{{bg2|bare}}, #ff{{bg3|bare}}, #ff{{bg2|bare}}, #ff{{rule|bare}}, #ff{{bg4|bare}}, #ff{{text|bare}}, #ff{{ink|bare}}, #ff{{text|bare}}, #ff{{bg1|bare}}, #ff{{paper|bare}}, #ff{{paper|bare}}, #ff{{bg4|bare}}, #ff{{ink|bare}}, #ff{{soft|bare}}, #ff{{muted|bare}}, #ff{{bg2|bare}}, #ff{{paper|bare}}, #ff{{bg2|bare}}, #ff{{text|bare}}, #ff{{muted|bare}}, #ff{{soft|bare}}
